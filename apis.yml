name: Moment Energy
description: 'Moment Energy is a Coquitlam, British Columbia clean-energy company that
  builds battery energy storage systems (BESS) from repurposed electric-vehicle batteries
  for commercial and industrial customers. Its Luna BESS is described as the first
  repurposed-battery system to achieve UL 1973, UL 9540, and UL 9540A certifications,
  and is applied to demand-charge management, grid backup, EV-charging support, and
  energy arbitrage across data centers, public institutions, transportation, food &
  beverage, manufacturing, and forestry. Moment Energy is a hardware and energy-services
  company and publishes no public developer API surface at this time.'
